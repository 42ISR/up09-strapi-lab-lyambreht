info:
  name: create tag
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/tags"
  body:
    type: json
    data: |-
      {
        "name": "Новый тег",
        "color": "#123456"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
